[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modbus-connector"
version = "0.14.1"
description = "PySide6 GUI for debugging Modbus buses and developing Modbus devices — master client, device simulator, RTU sniffer and gateway"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "cramen"}]
keywords = ["modbus", "modbus-tcp", "modbus-rtu", "modbus-client", "modbus-server", "modbus-slave", "modbus-simulator", "modbus-sniffer", "rs485", "plc", "scada", "industrial-automation", "gui"]
requires-python = ">=3.11"
classifiers = [
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "pymodbus[serial]==3.6.9",
]

[project.gui-scripts]
modbus-connector = "modbus_connector.app:main"

[project.scripts]
modbus-connector-cli = "modbus_connector.cli:main"

[project.urls]
Homepage = "https://github.com/cramen/modbus_connector"
Repository = "https://github.com/cramen/modbus_connector"
Issues = "https://github.com/cramen/modbus_connector/issues"

[project.optional-dependencies]
gui = [
    "PySide6",
    "pyqtgraph",
    "pyqtdarktheme",
]
# extras cannot reference each other in setuptools, so dev repeats the gui deps
dev = [
    "PySide6",
    "pyqtgraph",
    "pyqtdarktheme",
    "pytest",
    "pytest-asyncio",
    "ruff",
]
build = [
    "pyinstaller>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modbus_connector = ["templates/*.json", "templates/*/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
