name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create GitHub Releases on tags

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            suffix: macos
            release-files: dist/ModbusConnector.dmg
          - os: windows-latest
            suffix: windows
            release-files: dist/modbus-connector-windows.zip
          - os: ubuntu-latest
            suffix: linux
            release-files: dist/modbus-connector-linux.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create venv and install dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" == "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          "$PY" -m pip install -U pip
          "$PY" -m pip install -e ".[dev,build]"

      - name: Run tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          "$PY" -m pytest tests/ -q

      - name: Build (macOS/Linux)
        if: runner.os != 'Windows'
        run: ./build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat

      - name: Zip artifact (Windows/Linux)
        if: runner.os != 'macOS'
        shell: pwsh
        run: Compress-Archive -Path dist/ModbusConnector -DestinationPath ${{ matrix.release-files }}

      - uses: actions/upload-artifact@v4
        with:
          name: modbus-connector-${{ matrix.suffix }}
          path: ${{ matrix.release-files }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.release-files }}
          generate_release_notes: true
